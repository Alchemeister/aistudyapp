<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StudyAI - Master Your Coursework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563eb',
              secondary: '#475569',
              background: '#f8fafc',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'fade-in-up': 'fadeInUp 0.4s ease-out',
              'slide-up': 'slideUp 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css">
    <!-- PLACEHOLDER EMPTY IMPORTMAP TO STOP GEMINI FROM RE-ADDING -->
    <!-- ALL CONFLICTING IMPORTS REMOVED – LOCAL BUNDLED VERSIONS USED -->
    <script type="importmap">
    {
      "imports": {
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "idb-keyval": "https://esm.sh/idb-keyval@^6.2.2",
        "react-draggable": "https://esm.sh/react-draggable@^4.4.6",
        "react-router-dom": "https://esm.sh/react-router-dom@^6.22.0",
        "recharts": "https://esm.sh/recharts@^2.12.0",
        "firebase/": "https://esm.sh/firebase@^10.8.0/",
        "vite": "https://esm.sh/vite@^5.1.0",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^4.2.1"
      }
    }
    </script>
  </head>
  <body class="bg-background text-slate-900 antialiased min-h-screen">
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
